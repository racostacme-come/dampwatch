name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=dampwatch --cov-report=term-missing
      - run: python -m build
      - name: Reinstall built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python examples/energy_audit.py
      - run: dampwatch --output out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            out/
            dist/
