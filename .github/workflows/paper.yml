name: Build academic paper
on:
  push:
    paths: ['paper/**', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**', '.github/workflows/paper.yml']
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          python -m pip install pypdf==6.10.0
      - run: python paper/build.py --engine pdflatex
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: academic-paper
          path: |
            paper/paper.pdf
            paper/validation.json
